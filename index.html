<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="行動経済学、心理学、犯罪予防理論・EBPを、専門知識のない実務家にも分かりやすい日本語で整理した用語ライブラリー。">
<title>いちみず会EBP関連用語ライブラリー</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f9faf6;color:#30332e;font:15px/1.85 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
a{color:#58662f}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #afad5f;outline-offset:2px}
header{background:#34362e;color:#fff;padding:30px 18px}
header .inner,main{max-width:1050px;margin:auto}
h1{font-size:clamp(21px,3vw,29px);line-height:1.5;margin:0}
.sub{margin:5px 0 0;color:#e4e4d5;font-size:13px}
main{padding:22px 16px 64px}
h2{font-size:19px;margin:20px 0 10px}
p{overflow-wrap:anywhere}
.muted,.note{color:#60675e;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid #b3b49b;gap:7px;margin:8px 0 20px}
.tabs button{appearance:none;border:1px solid #d3d5c9;border-bottom:0;padding:10px 16px;border-radius:9px 9px 0 0;cursor:pointer;background:#efefe7;color:#323529;font:inherit;font-weight:600}
.tabs button[aria-selected=true]{background:#a6a45a;border-color:#a6a45a;color:#181c10}
.search{display:block;width:100%;border:1px solid #b9bbae;border-radius:8px;padding:12px 14px;font:inherit;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0}
.chips button{font:inherit;font-size:13px;cursor:pointer;border:1px solid #a6a98e;border-radius:22px;padding:6px 11px;background:#fff}
.chips button[aria-pressed=true]{background:#a6a45a;color:#171b10}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.term{display:block;border:1px solid #dfe0d7;background:#fff;border-radius:9px;padding:13px 14px;text-decoration:none;color:inherit;min-height:102px}
.term strong{display:block;font-size:15px}
.term .hint{color:#50564d;font-size:13px;margin:7px 0 0;line-height:1.65}
.term:hover{border-color:#92944e;background:#f8f8ed}
.group{margin:20px 0 24px}
.group h2{border-left:4px solid #a6a45a;padding-left:10px;margin:0 0 10px}
.pill{display:inline-block;background:#eae8d3;border-radius:5px;padding:2px 8px;font-size:12px;margin:3px 4px 3px 0}
.panel{background:#fff;border:1px solid #e1e2d7;border-radius:10px;padding:16px 19px;margin:16px 0}
.panel h2{font-size:16px;color:#535d31;margin:0 0 8px}
.panel p{margin:0}
.primary{border-left:5px solid #a6a45a}
.example{background:#f5f5eb}
.caution{border-left:5px solid #77785f}
.back{margin:0 0 16px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{border:1px solid #d1d3c1;padding:4px 10px;border-radius:14px;text-decoration:none}
.source{margin-bottom:13px;padding-bottom:10px;border-bottom:1px solid #efefed}
.source small{color:#61645b}
details.panel summary{font-weight:700;color:#535d31;cursor:pointer}
details.panel[open] summary{margin-bottom:10px}
.detail-row{margin:10px 0}
.detail-row strong{display:block;font-size:13px;color:#53574e}
.empty{color:#6a6c63;padding:22px;border:1px dashed #ccc;border-radius:10px;text-align:center}
.error{padding:16px;border:1px solid #b78989;background:#fff6f6;border-radius:9px}
footer{background:#eeeee7;padding:19px 12px;text-align:center;font-size:12px;color:#55594e}
@media(max-width:600px){header{padding:24px 14px}.tabs button{padding:9px 10px;font-size:13px}.cards{grid-template-columns:1fr}main{padding:16px 13px 42px}}
</style>
</head>
<body>
<header><div class="inner">
<h1>いちみず会EBP関連用語ライブラリー</h1>
<p class="sub">行動経済学・心理学・犯罪予防理論・EBPを、実務で使える言葉でつなぐ参照資料</p>
</div></header>
<main>
<nav id="tabs" class="tabs" role="tablist" aria-label="分野の切替">
<button data-tab="behavioral_economics" role="tab" aria-selected="true">行動経済学</button>
<button data-tab="psychology" role="tab" aria-selected="false">心理学</button>
<button data-tab="crime_theory" role="tab" aria-selected="false">犯罪予防理論・EBP</button>
</nav>
<label for="q"><strong>用語を横断検索</strong></label>
<p class="note">日本語で検索できます。検索時は分野をまたいで探します。</p>
<input id="q" class="search" type="search" placeholder="例：思い込み、施策の効果、行動しやすさ" autocomplete="off">
<p id="hint" role="status" class="note"></p>
<div id="filters" class="chips"></div>
<div id="results"><div class="empty">読み込み中です。</div></div>
</main>
<footer>まず平易な説明を示し、その後に研究上の定義・注意点・原典を確認できる構成です。犯罪予防への例は応用仮説であり、効果を保証するものではありません。</footer>
<script>
const TAB_NAMES={behavioral_economics:'行動経済学',psychology:'心理学',crime_theory:'犯罪予防理論・EBP'};
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=v=>String(v??'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim();
let DATA=[],selected='behavioral_economics',cat='すべて';

Promise.all([
  fetch('glossary.json').then(r=>{if(!r.ok)throw new Error('glossary.json');return r.json()}),
  fetch('plain_ja.json').then(r=>{if(!r.ok)throw new Error('plain_ja.json');return r.json()}),
  fetch('theories.json').then(r=>r.ok?r.json():[])
]).then(([terms,plain,theories])=>{
  const pmap=Object.fromEntries((plain.entries||[]).map(x=>[x.id,x]));
  DATA=terms.map(t=>{
    const p=pmap[t.id]||{};
    return {...t,kind:'term',
      display_name_ja:p.display_name_ja||t.ja,
      plain_summary:p.plain_summary||t.original_definition,
      plain_example:p.plain_example||t.application_hypothesis
    };
  });
  DATA.push(...theories.map(t=>({...t,kind:'theory',cat:t.id==='ebp'?'EBPの基礎資料':'犯罪予防理論',library_tabs:['crime_theory'],display_name_ja:t.ja,plain_summary:t.short||''})));
  render();
}).catch(err=>{
  $('results').innerHTML='<div class="error">データを読み込めませんでした。glossary.json と plain_ja.json が同じ階層にあるか確認してください。</div>';
});

$('q').addEventListener('input',()=>{cat='すべて';render()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;selected=b.dataset.tab;cat='すべて';render()});
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;render()});

function page(t){return t.kind==='theory'?'theories/'+encodeURIComponent(t.id)+'/':'words/'+encodeURIComponent(t.id)+'.html'}
function render(){
  if(!DATA.length)return;
  const s=norm($('q').value);
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===selected)));
  let base=DATA.filter(t=>{
    if(s){
      const fields=[t.ja,t.en,t.display_name_ja,t.plain_summary,t.plain_example,t.original_definition,t.explanation,t.cat,...(t.library_tabs||[]).map(x=>TAB_NAMES[x])];
      return fields.some(x=>norm(x).includes(s));
    }
    return (t.library_tabs||[]).includes(selected);
  });
  const cats=['すべて',...new Set(base.map(t=>t.cat).filter(Boolean))];
  if(!cats.includes(cat))cat='すべて';
  $('filters').innerHTML=cats.map(c=>'<button type="button" data-cat="'+esc(c)+'" aria-pressed="'+String(cat===c)+'">'+esc(c)+'</button>').join('');
  const matching=base.filter(t=>cat==='すべて'||t.cat===cat);
  $('hint').textContent=(s?'横断検索：':'表示分野：'+TAB_NAMES[selected]+'／')+matching.length+' 件';
  if(!matching.length){$('results').innerHTML='<div class="empty">該当する項目はありません。</div>';return;}
  const groups=[...new Set(matching.map(t=>t.cat))];
  $('results').innerHTML=groups.map(c=>'<section class="group"><h2>'+esc(c)+'</h2><div class="cards">'+
    matching.filter(t=>t.cat===c).sort((a,b)=>String(a.ja).localeCompare(String(b.ja),'ja')).map(t=>
      '<a class="term" href="'+page(t)+'"><strong>'+esc(t.display_name_ja||t.ja)+'</strong><p class="hint">'+esc(t.plain_summary||'')+'</p></a>'
    ).join('')+'</div></section>').join('');
}
</script>
</body></html>

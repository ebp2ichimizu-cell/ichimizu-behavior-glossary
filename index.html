<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="行動経済学、心理学、犯罪予防理論の用語を横断検索。定義・出典・応用仮説を整理。"><title>検索・索引｜いちみず会EBP関連用語ライブラリー</title><style>*{box-sizing:border-box}body{margin:0;background:#f9faf6;color:#30332e;font:15px/1.85 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}a{color:#58662f}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #afad5f;outline-offset:2px}header{background:#34362e;color:#fff;padding:32px 18px}header .inner,main{max-width:1050px;margin:auto}h1{font-size:clamp(21px,3vw,29px);line-height:1.5;margin:0}.sub{margin:4px 0;color:#e4e4d5;font-size:13px}main{padding:22px 16px 64px}h2{font-size:19px;margin:20px 0 10px}p{overflow-wrap:anywhere}.muted,.note{color:#60675e;font-size:13px}.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid #b3b49b;gap:7px;margin:8px 0 20px}.tabs button{appearance:none;border:1px solid #d3d5c9;border-bottom:0;padding:10px 16px;border-radius:9px 9px 0 0;cursor:pointer;background:#efefe7;color:#323529;font:inherit;font-weight:600}.tabs button[aria-selected=true]{background:#a6a45a;border-color:#a6a45a;color:#181c10}.search{display:block;width:100%;border:1px solid #b9bbae;border-radius:8px;padding:12px 14px;font:inherit;background:#fff}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0}.chips button{font:inherit;font-size:13px;cursor:pointer;border:1px solid #a6a98e;border-radius:22px;padding:6px 11px;background:#fff}.chips button[aria-pressed=true]{background:#a6a45a;color:#171b10}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.term{display:block;border:1px solid #dfe0d7;background:#fff;border-radius:9px;padding:12px 14px;text-decoration:none;color:inherit;min-height:95px}.term strong{display:block;font-size:15px}.term small{display:block;color:#656b61;font-size:12px;line-height:1.5}.term .hint{color:#62675c;font-size:12px;margin:6px 0 0}.term:hover{border-color:#92944e;background:#f8f8ed}.group{margin:20px 0 24px}.group h2{border-left:4px solid #a6a45a;padding-left:10px;margin:0 0 10px}.pill{display:inline-block;background:#eae8d3;border-radius:5px;padding:2px 8px;font-size:12px;margin:3px 4px 3px 0}.panel{background:#fff;border:1px solid #e1e2d7;border-radius:10px;padding:16px 19px;margin:18px 0}.panel h2{font-size:16px;color:#535d31;margin:0 0 8px}.panel p{margin:0}.back{margin:0 0 16px}.links{display:flex;gap:8px;flex-wrap:wrap}.links a{border:1px solid #d1d3c1;padding:4px 10px;border-radius:14px;text-decoration:none}.source{margin-bottom:13px;padding-bottom:10px;border-bottom:1px solid #efefed}.source small{color:#61645b}.theory{display:block;text-decoration:none;background:#fff;border:1px solid #dadbd0;border-radius:10px;padding:13px 15px;color:inherit}.theory small{color:#555b51}.theory .pending{font-size:12px;color:#706e50}.slide{margin:15px auto 20px;text-align:center}.slide img{max-width:100%;height:auto;border:1px solid #d6d6c9}.empty{color:#6a6c63;padding:22px;border:1px dashed #ccc;border-radius:10px;text-align:center}footer{background:#eeeee7;padding:19px 12px;text-align:center;font-size:12px;color:#55594e}@media(max-width:600px){header{padding:24px 14px}.tabs button{padding:9px 10px;font-size:13px}.cards{grid-template-columns:1fr}main{padding:16px 13px 42px}}</style></head><body><header><div class="inner"><h1>いちみず会EBP関連用語ライブラリー</h1><p class="sub">行動経済学・心理学・犯罪予防理論をつなぐ参照資料</p></div></header><main><nav id="tabs" class="tabs" role="tablist" aria-label="分野の切替"><button data-tab="behavioral_economics" role="tab" aria-selected="true">行動経済学</button><button data-tab="psychology" role="tab" aria-selected="false">心理学</button><button data-tab="crime_theory" role="tab" aria-selected="false">犯罪予防理論</button></nav><label for="q"><strong>用語を横断検索</strong></label><p class="note">検索語を入力すると、選択中のタブに関係なく全分野から探します。用語を選ぶと個別解説ページが開きます。</p><input id="q" class="search" type="search" placeholder="用語・英語・説明を検索" autocomplete="off"><p id="hint" role="status" class="note"></p><div id="filters" class="chips"></div><div id="results"></div></main><footer>原著の内容・研究者の解釈・犯罪予防への応用仮説は区別して掲載しています。未掲載資料は掲載準備中と表示します。</footer><script>const TERMS=[{"id":"capability-opportunity-motivation-behaviour","ja":"COM-Bモデル","en":"Capability, Opportunity, Motivation – Behaviour","category":"効果検証・設計","short":"行動を能力・機会・動機の3条件から分析するモデル。","tabs":["behavioral_economics"],"kind":"term"},{"id":"easy-attractive-social-timely","ja":"EAST","en":"Easy, Attractive, Social, Timely","category":"効果検証・設計","short":"簡単・魅力的・社会的・タイムリーの4視点から施策を設計する枠組み。","tabs":["behavioral_economics"],"kind":"term"},{"id":"messenger-incentives-norms-defaults-salience-priming-affect-commitments-ego","ja":"MINDSPACE","en":"Messenger, Incentives, Norms, Defaults, Salience, Priming, Affect, Commitments, Ego","category":"効果検証・設計","short":"行動に影響する9要素を整理した政策設計の枠組み。","tabs":["behavioral_economics"],"kind":"term"},{"id":"anchoring","ja":"アンカリング","en":"Anchoring","category":"判断の偏り","short":"先に示された情報・数値がその後の判断の基準になる現象。","tabs":["behavioral_economics"],"kind":"term"},{"id":"incentive","ja":"インセンティブ","en":"Incentive","category":"介入技法","short":"報酬や費用など行動の便益・負担を変える要因。","tabs":["behavioral_economics"],"kind":"term"},{"id":"commitment","ja":"コミットメント","en":"Commitment","category":"介入技法","short":"将来の行動を約束・表明すること。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"sludge","ja":"スラッジ","en":"Sludge","category":"介入技法","short":"望ましい選択を妨げる不要な手続負担・摩擦。","tabs":["behavioral_economics"],"kind":"term"},{"id":"social-support","ja":"ソーシャルサポート（社会的支援）","en":"Social Support","category":"社会心理・対人関係","short":"情報提供、実務的援助、情緒的な支えなど、他者との関係を通じて得られる支援。","tabs":["psychology"],"kind":"term"},{"id":"timely-prompt","ja":"タイムリーな働きかけ","en":"Timely Prompt","category":"介入技法","short":"目標行動を実行できる直前や機会のある時点で提示する案内。","tabs":["behavioral_economics"],"kind":"term"},{"id":"default","ja":"デフォルト","en":"Default","category":"介入技法","short":"変更操作をしない場合に適用される初期選択。","tabs":["behavioral_economics"],"kind":"term"},{"id":"nudge","ja":"ナッジ","en":"Nudge","category":"基本概念","short":"選択肢の禁止や経済的誘因の大幅な変更をせず、選択環境の工夫で行動を促す介入。","tabs":["behavioral_economics"],"kind":"term"},{"id":"heuristic","ja":"ヒューリスティック","en":"Heuristic","category":"基本概念","short":"判断を効率化するための経験則や思考の近道。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"heuristic-systematic-model","ja":"ヒューリスティック・システマティックモデル","en":"Heuristic–Systematic Model","category":"広報・説得","short":"簡単な判断規則による処理と、内容の詳細な処理という二つの仕組みに注目する説得モデル。","tabs":["psychology"],"kind":"term"},{"id":"feedback","ja":"フィードバック","en":"Feedback","category":"介入技法","short":"実際の行動や結果を伝え次の行動に役立てる情報提供。","tabs":["behavioral_economics"],"kind":"term"},{"id":"framing-effect","ja":"フレーミング効果","en":"Framing Effect","category":"判断の偏り","short":"実質的に等価な選択肢でも表現で判断が変わる現象。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"boomerang-effect","ja":"ブーメラン効果","en":"Boomerang Effect","category":"社会的影響","short":"改善を狙った働きかけが反対方向の行動変化をもたらす現象。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"priming","ja":"プライミング","en":"Priming","category":"社会的影響","short":"先行刺激が後続の情報処理や反応に及ぼす影響。再現性には条件差がある。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"prospect-theory","ja":"プロスペクト理論","en":"Prospect Theory","category":"意思決定の理論","short":"参照点からの利得・損失と、その生起確率を主観的に変換してリスク下の選択を説明する記述的理論。","tabs":["behavioral_economics"],"kind":"term"},{"id":"process-evaluation","ja":"プロセス評価","en":"Process Evaluation","category":"効果検証・設計","short":"介入が誰に届き、どのように実施され、どう受け止められたかを検討する評価。","tabs":["behavioral_economics"],"kind":"term"},{"id":"messenger-effect","ja":"メッセンジャー効果","en":"Messenger Effect","category":"社会的影響","short":"情報の内容に加え発信者が反応に影響すること。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"mental-accounting","ja":"メンタル・アカウンティング","en":"Mental Accounting","category":"意思決定の理論","short":"金銭や資源を心理的に別勘定として扱う意思決定傾向。","tabs":["behavioral_economics"],"kind":"term"},{"id":"randomized-controlled-trial","ja":"ランダム化比較試験","en":"Randomized Controlled Trial（RCT）","category":"効果検証・設計","short":"対象を無作為に割り付けて介入条件間の結果を比較する方法。","tabs":["behavioral_economics"],"kind":"term"},{"id":"risk-perception","ja":"リスク認知","en":"Risk Perception","category":"行動の障壁","short":"被害の発生可能性・深刻さなどについての主観的な評価。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"reminder","ja":"リマインダー","en":"Reminder","category":"介入技法","short":"適切な時点で必要な行動を思い出させる通知。","tabs":["behavioral_economics"],"kind":"term"},{"id":"central-route","ja":"中心ルート","en":"Central Route","category":"広報・説得","short":"説得内容の主張や根拠を、比較的丁寧に検討する情報処理の経路。","tabs":["psychology"],"kind":"term"},{"id":"subjective-norm","ja":"主観的規範","en":"Subjective Norm","category":"社会心理・対人関係","short":"本人が重視する人々から、その行動を行うべきだと期待・圧力を感じている程度。社会全体の実際の行動頻度とは異なる。","tabs":["psychology"],"kind":"term"},{"id":"theory-of-planned-behaviour","ja":"予定行動理論","en":"Theory of Planned Behavior","category":"意思決定・動機づけ","short":"ある行動の意図を、行動への態度・主観的規範・知覚された行動統制によって説明し、行動統制も実際の行動に関わると考える理論。","tabs":["psychology"],"kind":"term"},{"id":"dual-process-theories","ja":"二重過程理論","en":"Dual-process Theories","category":"基本概念","short":"比較的自動的な処理と制御的な処理を区別する認知心理学上の複数の理論の総称。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"implementation-fidelity","ja":"介入の実装忠実度","en":"Implementation Fidelity","category":"効果検証・設計","short":"介入の内容・量・頻度・提供方法が計画どおり実施された程度。","tabs":["behavioral_economics"],"kind":"term"},{"id":"endowment-effect","ja":"保有効果","en":"Endowment Effect","category":"判断の偏り","short":"所有する物を所有していない場合より高く評価することがある現象。","tabs":["behavioral_economics"],"kind":"term"},{"id":"confidence-interval","ja":"信頼区間","en":"Confidence Interval","category":"効果検証・設計","short":"繰り返し標本抽出したとき所定割合で母数を含む手続に基づく区間推定。","tabs":["behavioral_economics"],"kind":"term"},{"id":"health-belief-model","ja":"健康信念モデル","en":"Health Belief Model","category":"防護行動・リスク認知","short":"病気の脅威や対策の利益・障壁などに関する認知を用いて予防的行動を説明するモデル。後年には行動のきっかけや自己効力感も重視されている。","tabs":["psychology"],"kind":"term"},{"id":"bystander-effect","ja":"傍観者効果","en":"Bystander Effect","category":"社会心理・対人関係","short":"緊急事態などで、他の人がいると認識することで、個人が援助・通報する可能性が低くなる場合がある現象。","tabs":["psychology"],"kind":"term"},{"id":"intrinsic-motivation","ja":"内発的動機づけ","en":"Intrinsic Motivation","category":"意思決定・動機づけ","short":"活動そのものへの関心・面白さ・満足によって生じる動機づけ。報酬獲得のみを目的とする場合と区別する。","tabs":["psychology"],"kind":"term"},{"id":"internal-validity","ja":"内的妥当性","en":"Internal Validity","category":"効果検証・設計","short":"観察された結果の差を介入の因果効果と解釈できる程度。","tabs":["behavioral_economics"],"kind":"term"},{"id":"gain-loss-message-framing","ja":"利得・損失フレーミング（広報）","en":"Gain–Loss Message Framing","category":"広報・説得","short":"行動した場合の利益を強調するか、行動しなかった場合の損失を強調するかというメッセージ提示の違い。","tabs":["psychology"],"kind":"term"},{"id":"availability-heuristic","ja":"利用可能性ヒューリスティック","en":"Availability Heuristic","category":"判断の偏り","short":"想起しやすさに影響されて頻度や確率を判断する傾向。","tabs":["behavioral_economics"],"kind":"term"},{"id":"reach","ja":"到達率","en":"Reach","category":"効果検証・設計","short":"対象者のうち介入や情報が実際に届いた人の割合。","tabs":["behavioral_economics"],"kind":"term"},{"id":"institutional-legitimacy","ja":"制度的正統性（警察等）","en":"Institutional Legitimacy","category":"社会心理・対人関係","short":"当局や組織が権限を行使することの適切さ、従う義務の認識などに関係する社会心理的概念。","tabs":["psychology"],"kind":"term"},{"id":"effect-size","ja":"効果量","en":"Effect Size","category":"効果検証・設計","short":"介入による差や関連の大きさを、定義された尺度で表した指標。","tabs":["behavioral_economics"],"kind":"term"},{"id":"danger-control","ja":"危険制御","en":"Danger Control","category":"防護行動・リスク認知","short":"危険を減らすための具体的な対応へ注意や行動が向かう反応。EPPMで想定される反応の一つ。","tabs":["psychology"],"kind":"term"},{"id":"reference-dependence","ja":"参照点依存性","en":"Reference Dependence","category":"意思決定の理論","short":"結果を絶対水準だけでなく、期待・現状などの参照点との差として評価すること。","tabs":["behavioral_economics"],"kind":"term"},{"id":"hyperbolic-discounting","ja":"双曲割引","en":"Hyperbolic Discounting","category":"判断の偏り","short":"将来価値の割引率が時間を通じ一定でないモデル。","tabs":["behavioral_economics"],"kind":"term"},{"id":"response-cost","ja":"反応コスト","en":"Response Cost","category":"行動の障壁","short":"推奨する防護行動に伴う時間・費用・手間・不便などの認識上の負担。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"response-efficacy","ja":"反応効果性","en":"Response Efficacy","category":"行動の障壁","short":"ある対策が脅威や被害を減らせると認識すること。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"peripheral-route","ja":"周辺ルート","en":"Peripheral Route","category":"広報・説得","short":"主張の詳細な吟味をあまり伴わず、発信者の印象や単純な手掛かりが態度判断に関わる経路。","tabs":["psychology"],"kind":"term"},{"id":"injunctive-norms","ja":"命令的規範","en":"Injunctive Norms","category":"社会的影響","short":"周囲の人が何を望ましいと考えているかについての認識。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"sunk-cost-effect","ja":"埋没費用効果","en":"Sunk Cost Effect","category":"判断の偏り","short":"既に回収できない費用を、以後の判断に不適切に反映する傾向。","tabs":["behavioral_economics"],"kind":"term"},{"id":"stages-of-change-model","ja":"変容ステージモデル","en":"Stages of Change / Transtheoretical Model","category":"意思決定・動機づけ","short":"行動変容の準備状況を、無関心・関心・準備・実行・維持などの段階で整理するモデル。","tabs":["psychology"],"kind":"term"},{"id":"external-validity","ja":"外的妥当性","en":"External Validity","category":"効果検証・設計","short":"研究結果が他の対象・時点・環境にも当てはまる程度。","tabs":["behavioral_economics"],"kind":"term"},{"id":"pluralistic-ignorance","ja":"多元的無知","en":"Pluralistic Ignorance","category":"社会心理・対人関係","short":"多くの人が個人的には疑問や懸念を持ちながら、他の人は受け入れていると誤って推測し、集団全体の認識を取り違える現象。","tabs":["psychology"],"kind":"term"},{"id":"mediation-analysis","ja":"媒介分析","en":"Mediation Analysis","category":"効果検証・設計","short":"介入と結果の間にある媒介過程を分析する方法。因果的解釈には追加仮定が必要。","tabs":["behavioral_economics"],"kind":"term"},{"id":"implementation-intentions","ja":"実行意図","en":"Implementation Intentions","category":"介入技法","short":"特定の状況と行動を「もしXならYする」という形式で事前に結び付ける計画。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"coping-appraisal","ja":"対処評価","en":"Coping Appraisal","category":"防護行動・リスク認知","short":"防護行動を行うことで危険を減らせるか、本人に実行できるか、負担はどの程度かを評価する過程。","tabs":["psychology"],"kind":"term"},{"id":"perceived-benefits","ja":"対策の利益認知","en":"Perceived Benefits","category":"防護行動・リスク認知","short":"特定の予防・防護行動によって危険を減らせるなど、望ましい結果が得られると考える程度。","tabs":["psychology"],"kind":"term"},{"id":"psychological-reactance","ja":"心理的リアクタンス","en":"Psychological Reactance","category":"判断の偏り","short":"自由を制限されたと感じた際に反発が生じる心理的反応。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"psychological-safety","ja":"心理的安全性","en":"Psychological Safety","category":"社会心理・対人関係","short":"チーム内で質問、懸念、誤りの報告など対人的なリスクを取っても安全だという共有された認識。","tabs":["psychology"],"kind":"term"},{"id":"fear-control","ja":"恐怖制御","en":"Fear Control","category":"防護行動・リスク認知","short":"脅威そのものを減らすのでなく、不安や恐怖という感情を避けようとする反応。","tabs":["psychology"],"kind":"term"},{"id":"fear-appeal","ja":"恐怖訴求","en":"Fear Appeal","category":"広報・説得","short":"怖さや危険性への注意を喚起し、特定の態度や行動に変化を促そうとするコミュニケーション技法。","tabs":["psychology"],"kind":"term"},{"id":"intention-behaviour-gap","ja":"意図と行動のギャップ","en":"Intention–Behaviour Gap","category":"効果検証・設計","short":"行動するつもりでも実行しない不一致。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"affect","ja":"感情・情動","en":"Affect","category":"社会的影響","short":"感情がリスク評価や選択に影響すること。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"procedural-justice","ja":"手続的公正","en":"Procedural Justice","category":"社会心理・対人関係","short":"意思決定や権限行使の過程が公平、尊重的、中立的で、説明や発言機会があると認識されること。","tabs":["psychology"],"kind":"term"},{"id":"extended-parallel-process-model","ja":"拡張並行過程モデル","en":"Extended Parallel Process Model (EPPM)","category":"防護行動・リスク認知","short":"脅威情報を受けた際の反応を、脅威の認知と対策の有効性・実行可能性の認知から考える恐怖訴求モデル。","tabs":["psychology"],"kind":"term"},{"id":"inoculation-theory","ja":"接種理論（説得抵抗）","en":"Inoculation Theory","category":"広報・説得","short":"弱い反論や誤情報への対処を先に示すことで、後から来る説得・誤情報に対する抵抗力を高めようとする理論。","tabs":["psychology"],"kind":"term"},{"id":"loss-aversion","ja":"損失回避","en":"Loss Aversion","category":"判断の偏り","short":"同程度の利益より損失を強く評価する傾向。条件により程度が変わる。","tabs":["behavioral_economics"],"kind":"term"},{"id":"friction-costs","ja":"摩擦コスト","en":"Friction Costs","category":"介入技法","short":"小さな手間、時間、操作負担など行動の障壁。","tabs":["behavioral_economics"],"kind":"term"},{"id":"statistical-power","ja":"検出力","en":"Statistical Power","category":"効果検証・設計","short":"特定の真の効果があるとき、設定した検定が帰無仮説を棄却する確率。","tabs":["behavioral_economics"],"kind":"term"},{"id":"optimism-bias","ja":"楽観バイアス","en":"Optimism Bias","category":"判断の偏り","short":"将来の望ましい結果を相対的に期待し、望ましくない結果を過小視することがある傾向。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"authority-bias","ja":"権威バイアス","en":"Authority Bias","category":"社会的影響","short":"権威的な立場や肩書きを判断の手掛かりとして用いる傾向を指す便宜的な表現。服従、信頼、発信者効果とは区別する。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"limited-attention","ja":"注意の限界","en":"Limited Attention","category":"行動の障壁","short":"人があらゆる情報に均等な注意を配れず、一部を見落とす性質。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"present-bias","ja":"現在バイアス","en":"Present Bias","category":"判断の偏り","short":"目先の負担や利益を将来の負担や利益に比べ重視する傾向。","tabs":["behavioral_economics"],"kind":"term"},{"id":"status-quo-bias","ja":"現状維持バイアス","en":"Status Quo Bias","category":"判断の偏り","short":"現在の状態を変えない選択を好みやすい傾向。","tabs":["behavioral_economics"],"kind":"term"},{"id":"heterogeneous-treatment-effects","ja":"異質な介入効果","en":"Heterogeneous Treatment Effects","category":"効果検証・設計","short":"対象や状況によって介入効果が異なること。","tabs":["behavioral_economics"],"kind":"term"},{"id":"goal-setting-theory","ja":"目標設定理論","en":"Goal-Setting Theory","category":"意思決定・動機づけ","short":"目標の具体性・難易度やフィードバック等が課題遂行にどのように関わるかを整理する理論。","tabs":["psychology"],"kind":"term"},{"id":"perceived-behavioural-control","ja":"知覚された行動統制","en":"Perceived Behavioral Control","category":"意思決定・動機づけ","short":"目的の行動を自分で実行・統制できると感じる程度。実際の能力や機会そのものとは区別される。","tabs":["psychology"],"kind":"term"},{"id":"probability-weighting","ja":"確率加重","en":"Probability Weighting","category":"意思決定の理論","short":"客観的確率をそのまま判断に使わず、非線形に重み付けする現象・モデル。","tabs":["behavioral_economics"],"kind":"term"},{"id":"confirmation-bias","ja":"確証バイアス","en":"Confirmation Bias","category":"判断の偏り","short":"既存の信念に合う情報を重視しやすい傾向。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"social-learning-theory","ja":"社会的学習理論","en":"Social Learning Theory","category":"社会心理・対人関係","short":"他者の行動とその結果の観察、認知的過程、環境との相互作用による行動習得を説明する理論。","tabs":["psychology"],"kind":"term"},{"id":"social-proof","ja":"社会的証明","en":"Social Proof","category":"社会的影響","short":"他者の行動を自分の選択の手掛かりとする現象。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"social-norms","ja":"社会規範","en":"Social Norms","category":"社会的影響","short":"集団で一般的または望ましいと認識される行動の基準。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"elaboration-likelihood-model","ja":"精緻化見込みモデル","en":"Elaboration Likelihood Model (ELM)","category":"広報・説得","short":"説得メッセージの吟味の程度に応じ、論拠の精査と周辺的手掛かりなどが態度変化に異なる役割を果たすモデル。","tabs":["psychology"],"kind":"term"},{"id":"outcome-expectancy","ja":"結果予期","en":"Outcome Expectancy","category":"意思決定・動機づけ","short":"特定の行動をした場合に、どのような結果が生じると本人が予想するか。","tabs":["psychology"],"kind":"term"},{"id":"statistical-significance","ja":"統計的有意差","en":"Statistical Significance","category":"効果検証・設計","short":"統計モデルと帰無仮説の下で算出するp値が、事前に設定した有意水準を下回るなどの基準を満たすこと。","tabs":["behavioral_economics"],"kind":"term"},{"id":"perceived-susceptibility","ja":"罹患・被害の可能性認知","en":"Perceived Susceptibility","category":"防護行動・リスク認知","short":"本人が特定の危険や被害を受ける可能性をどう見積もるかという主観的な認知。","tabs":["psychology"],"kind":"term"},{"id":"habit-formation","ja":"習慣形成","en":"Habit Formation","category":"介入技法","short":"特定状況での反復によって比較的自動的に行動するようになる過程。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"active-choice","ja":"能動的選択","en":"Active Choice","category":"介入技法","short":"選択を放置させず、本人に明示的な意思決定を求める設計。","tabs":["behavioral_economics"],"kind":"term"},{"id":"threat-appraisal","ja":"脅威評価","en":"Threat Appraisal","category":"防護行動・リスク認知","short":"防護動機理論等で、危険の深刻さ、起こりやすさ、危険行動を続ける利益などを評価する過程。","tabs":["psychology"],"kind":"term"},{"id":"self-efficacy","ja":"自己効力感","en":"Self-efficacy","category":"行動の障壁","short":"求められる行動を自分で実行できると考える認識。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"self-determination-theory","ja":"自己決定理論","en":"Self-Determination Theory","category":"意思決定・動機づけ","short":"自律性、有能感、関係性への基本的欲求と動機づけの質に注目する理論。","tabs":["psychology"],"kind":"term"},{"id":"autonomy-support","ja":"自律性支援","en":"Autonomy Support","category":"意思決定・動機づけ","short":"相手の視点を尊重し、理由を説明し、不必要な統制を避けながら選択を支える関わり方。","tabs":["psychology"],"kind":"term"},{"id":"attitude-toward-behaviour","ja":"行動に対する態度","en":"Attitude Toward the Behavior","category":"意思決定・動機づけ","short":"特定の行動を本人が好ましいか好ましくないかと評価する程度。人や対象一般への好き嫌いとは区別する。","tabs":["psychology"],"kind":"term"},{"id":"behavioural-insights","ja":"行動インサイト","en":"Behavioural Insights","category":"基本概念","short":"心理学・行動科学等の研究知見を実際の行動と政策の設計・検証に結びつける方法。","tabs":["behavioral_economics"],"kind":"term"},{"id":"behavioural-bottleneck","ja":"行動上のボトルネック","en":"Behavioural Bottleneck","category":"行動の障壁","short":"目標行動に到る過程で、行動の実現を主に阻んでいる段階や条件。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"readiness-to-change","ja":"行動変容への準備性","en":"Readiness to Change","category":"意思決定・動機づけ","short":"対象者がある行動を変えることについて、どの程度意思や準備を持っているか。","tabs":["psychology"],"kind":"term"},{"id":"prompt-cue","ja":"行動手掛かり","en":"Behavioural Cue","category":"介入技法","short":"望ましい行動が必要となる状況で、その行動を想起・開始する合図や刺激。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"behavioral-economics","ja":"行動経済学","en":"Behavioral Economics","category":"基本概念","short":"心理的・社会的要因を意思決定や経済行動の分析に組み込む研究分野。","tabs":["behavioral_economics"],"kind":"term"},{"id":"implementation-plan","ja":"行動計画","en":"Action Planning","category":"介入技法","short":"目標行動をいつ・どこで・どのように実施するかを具体化する計画。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"observational-learning","ja":"観察学習","en":"Observational Learning","category":"社会心理・対人関係","short":"他者が行動する様子やその結果を見て、自分の行動を学ぶこと。","tabs":["psychology"],"kind":"term"},{"id":"implementation-intention-gap","ja":"計画と実行の不一致","en":"Planning–Action Gap","category":"行動の障壁","short":"立てた行動計画とその実施結果の不一致を指す説明表現。独立した標準学術用語としての原典は確認されていない。","tabs":["behavioral_economics"],"kind":"term"},{"id":"planning-fallacy","ja":"計画錯誤","en":"Planning Fallacy","category":"判断の偏り","short":"将来の作業の完了に必要な時間などを、過去の実績や障害を十分に考慮せず楽観的に見積もる傾向。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"descriptive-norms","ja":"記述的規範","en":"Descriptive Norms","category":"社会的影響","short":"周囲の人が実際にどうしているかについての認識。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"cognitive-bias","ja":"認知バイアス","en":"Cognitive Bias","category":"基本概念","short":"判断や情報処理に生じる系統的な偏りの総称。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"cognitive-dissonance","ja":"認知的不協和","en":"Cognitive Dissonance","category":"認知・判断","short":"態度・信念・行動などが矛盾するときに生じる心理的不整合や、その低減過程を説明する概念。","tabs":["psychology"],"kind":"term"},{"id":"cognitive-appraisal","ja":"認知的評価（ストレス）","en":"Cognitive Appraisal","category":"防護行動・リスク認知","short":"出来事が自分にとってどのような意味を持ち、対処できるかを評価する過程。","tabs":["psychology"],"kind":"term"},{"id":"cognitive-load","ja":"認知負荷","en":"Cognitive Load","category":"行動の障壁","short":"課題を処理する際に限られた認知資源に掛かる負担。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"diffusion-of-responsibility","ja":"責任の分散","en":"Diffusion of Responsibility","category":"社会心理・対人関係","short":"他にも対応する人がいると考えることで、一人ひとりが感じる対応責任が弱まる現象。","tabs":["psychology"],"kind":"term"},{"id":"overconfidence","ja":"過信","en":"Overconfidence","category":"判断の偏り","short":"自分の判断精度や能力を実際以上に高く評価する傾向。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"choice-architecture","ja":"選択アーキテクチャ","en":"Choice Architecture","category":"基本概念","short":"選択肢の表示・配置・初期設定など意思決定環境の構造。","tabs":["behavioral_economics"],"kind":"term"},{"id":"simplification","ja":"選択環境の簡素化","en":"Simplification","category":"介入技法","short":"情報や手順を整理して不要な選択負担を減らすこと。","tabs":["behavioral_economics"],"kind":"term"},{"id":"choice-overload","ja":"選択過負荷","en":"Choice Overload","category":"判断の偏り","short":"選択肢や情報の多さが選択を難しくする場合がある現象。","tabs":["behavioral_economics"],"kind":"term"},{"id":"perceived-severity","ja":"重大性認知","en":"Perceived Severity","category":"防護行動・リスク認知","short":"被害が発生した場合の身体的、経済的、社会的影響を本人がどの程度重大と考えるか。","tabs":["psychology"],"kind":"term"},{"id":"bounded-rationality","ja":"限定合理性","en":"Bounded Rationality","category":"基本概念","short":"時間や情報、認知能力に制約があり、完全な最適化ができないこと。","tabs":["behavioral_economics"],"kind":"term"},{"id":"perceived-barriers","ja":"障壁認知","en":"Perceived Barriers","category":"防護行動・リスク認知","short":"ある行動を実行する際に予想される費用、時間、面倒さ、不安、副作用などの不利益の認知。","tabs":["psychology"],"kind":"term"},{"id":"collective-efficacy","ja":"集合的効力感","en":"Collective Efficacy","category":"社会心理・対人関係","short":"地域の社会的結束と、公共の利益のために周囲が介入しようとする期待を結び付けた概念。","tabs":["psychology"],"kind":"term"},{"id":"salience","ja":"顕著性","en":"Salience","category":"社会的影響","short":"目立ち、注意が向けられやすい性質。","tabs":["behavioral_economics","psychology"],"kind":"term"},{"id":"routine-activity-theory","ja":"日常活動理論","en":"Routine Activity Theory","category":"犯罪予防理論","short":"犯罪の機会が成立する条件を考えるための理論。","tabs":["crime_theory"],"kind":"theory","slide_status":"pending"},{"id":"rational-choice-theory","ja":"合理的選択理論","en":"Rational Choice Perspective","category":"犯罪予防理論","short":"犯罪に関わる利益・負担・リスクの判断を考える視点。","tabs":["crime_theory"],"kind":"theory","slide_status":"pending"},{"id":"protection-motivation-theory","ja":"防護動機理論","en":"Protection Motivation Theory","category":"犯罪予防理論","short":"危険への脅威評価と、対処行動に関する評価を考える理論。","tabs":["crime_theory"],"kind":"theory","slide_status":"pending"},{"id":"cpted","ja":"CPTED（環境設計による犯罪予防）","en":"Crime Prevention Through Environmental Design","category":"犯罪予防理論","short":"環境の設計・管理を通じて犯罪機会を減らす考え方。","tabs":["crime_theory"],"kind":"theory","slide_status":"pending"}];
const TAB_NAMES={behavioral_economics:'行動経済学',psychology:'心理学',crime_theory:'犯罪予防理論'};
const $=id=>document.getElementById(id), q=$('q'),hint=$('hint'),res=$('results'),filters=$('filters'),tabbar=$('tabs');
let selected='behavioral_economics',cat='すべて';
function norm(v){return String(v||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ').trim()}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function page(t){return t.kind==='theory'?'theories/'+encodeURIComponent(t.id)+'/':'words/'+encodeURIComponent(t.id)+'.html'}
function render(){let s=norm(q.value);document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===selected)));
let base=TERMS.filter(t=>s?[t.ja,t.en,t.short,t.category,...t.tabs.map(x=>TAB_NAMES[x])].some(x=>norm(x).includes(s)):t.tabs.includes(selected));
let cats=['すべて',...new Set(base.map(t=>t.category))];if(!cats.includes(cat))cat='すべて';
filters.innerHTML=cats.map(c=>'<button type="button" data-cat="'+esc(c)+'" aria-pressed="'+String(cat===c)+'">'+esc(c)+'</button>').join('');
let matching=base.filter(t=>cat==='すべて'||t.category===cat),all=TERMS.length;
hint.textContent=(s?'横断検索：':'表示分野：'+TAB_NAMES[selected]+'／')+matching.length+' 件（登録用語 '+TERMS.filter(t=>t.kind==='term').length+' 語、理論 '+TERMS.filter(t=>t.kind==='theory').length+' 件）';
if(!matching.length){res.innerHTML='<div class="empty">該当する項目はありません。</div>';return;}
res.innerHTML=[...new Set(matching.map(t=>t.category))].map(c=>'<section class="group"><h2>'+esc(c)+'</h2><div class="cards">'+matching.filter(t=>t.category===c).sort((a,b)=>a.ja.localeCompare(b.ja,'ja')).map(t=>'<a class="term" href="'+page(t)+'"><strong>'+esc(t.ja)+'</strong><small>'+esc(t.en)+'</small><p class="hint">'+esc(t.short)+'</p>'+(t.kind==='theory'&&t.slide_status!=='published'?'<small>3枚スライド：掲載準備中</small>':'')+'</a>').join('')+'</div></section>').join('');}
tabbar.addEventListener('click',e=>{let b=e.target.closest('button[data-tab]');if(!b)return;selected=b.dataset.tab;cat='すべて';render()});
filters.addEventListener('click',e=>{let b=e.target.closest('button[data-cat]');if(!b)return;cat=b.dataset.cat;render()});
q.addEventListener('input',()=>{cat='すべて';render()});
const p=new URLSearchParams(location.search);if(p.has('q'))q.value=p.get('q');if(p.has('tab')&&TAB_NAMES[p.get('tab')])selected=p.get('tab');render();</script></body></html>

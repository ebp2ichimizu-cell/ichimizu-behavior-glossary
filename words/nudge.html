<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="いちみず会EBP関連用語ライブラリーの実務家向け解説。">
<title>用語解説｜いちみず会EBP関連用語ライブラリー</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f9faf6;color:#30332e;font:15px/1.85 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
a{color:#58662f}
a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #afad5f;outline-offset:2px}
header{background:#34362e;color:#fff;padding:30px 18px}
header .inner,main{max-width:1050px;margin:auto}
h1{font-size:clamp(21px,3vw,29px);line-height:1.5;margin:0}
.sub{margin:5px 0 0;color:#e4e4d5;font-size:13px}
main{padding:22px 16px 64px}
h2{font-size:19px;margin:20px 0 10px}
p{overflow-wrap:anywhere}
.muted,.note{color:#60675e;font-size:13px}
.tabs{display:flex;flex-wrap:wrap;border-bottom:2px solid #b3b49b;gap:7px;margin:8px 0 20px}
.tabs button{appearance:none;border:1px solid #d3d5c9;border-bottom:0;padding:10px 16px;border-radius:9px 9px 0 0;cursor:pointer;background:#efefe7;color:#323529;font:inherit;font-weight:600}
.tabs button[aria-selected=true]{background:#a6a45a;border-color:#a6a45a;color:#181c10}
.search{display:block;width:100%;border:1px solid #b9bbae;border-radius:8px;padding:12px 14px;font:inherit;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:11px 0}
.chips button{font:inherit;font-size:13px;cursor:pointer;border:1px solid #a6a98e;border-radius:22px;padding:6px 11px;background:#fff}
.chips button[aria-pressed=true]{background:#a6a45a;color:#171b10}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.term{display:block;border:1px solid #dfe0d7;background:#fff;border-radius:9px;padding:13px 14px;text-decoration:none;color:inherit;min-height:102px}
.term strong{display:block;font-size:15px}
.term .hint{color:#50564d;font-size:13px;margin:7px 0 0;line-height:1.65}
.term:hover{border-color:#92944e;background:#f8f8ed}
.group{margin:20px 0 24px}
.group h2{border-left:4px solid #a6a45a;padding-left:10px;margin:0 0 10px}
.pill{display:inline-block;background:#eae8d3;border-radius:5px;padding:2px 8px;font-size:12px;margin:3px 4px 3px 0}
.panel{background:#fff;border:1px solid #e1e2d7;border-radius:10px;padding:16px 19px;margin:16px 0}
.panel h2{font-size:16px;color:#535d31;margin:0 0 8px}
.panel p{margin:0}
.primary{border-left:5px solid #a6a45a}
.example{background:#f5f5eb}
.caution{border-left:5px solid #77785f}
.back{margin:0 0 16px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{border:1px solid #d1d3c1;padding:4px 10px;border-radius:14px;text-decoration:none}
.source{margin-bottom:13px;padding-bottom:10px;border-bottom:1px solid #efefed}
.source small{color:#61645b}
details.panel summary{font-weight:700;color:#535d31;cursor:pointer}
details.panel[open] summary{margin-bottom:10px}
.detail-row{margin:10px 0}
.detail-row strong{display:block;font-size:13px;color:#53574e}
.empty{color:#6a6c63;padding:22px;border:1px dashed #ccc;border-radius:10px;text-align:center}
.error{padding:16px;border:1px solid #b78989;background:#fff6f6;border-radius:9px}
footer{background:#eeeee7;padding:19px 12px;text-align:center;font-size:12px;color:#55594e}
@media(max-width:600px){header{padding:24px 14px}.tabs button{padding:9px 10px;font-size:13px}.cards{grid-template-columns:1fr}main{padding:16px 13px 42px}}
</style>
</head>
<body>
<header><div class="inner">
<h1>いちみず会EBP関連用語ライブラリー</h1>
<p class="sub">最初に実務家向けの説明、その後に研究上の定義・原典を確認できます</p>
</div></header>
<main id="main"><div class="empty">読み込み中です。</div></main>
<footer>平易な説明は理解の入口です。研究上の厳密な定義・限界・出典も併記しています。</footer>
<script>
const TERM_ID="nudge";
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
Promise.all([
  fetch('../glossary.json').then(r=>{if(!r.ok)throw new Error('glossary.json');return r.json()}),
  fetch('../plain_ja.json').then(r=>{if(!r.ok)throw new Error('plain_ja.json');return r.json()})
]).then(([terms,plain])=>{
  const t=terms.find(x=>x.id===TERM_ID);
  const p=(plain.entries||[]).find(x=>x.id===TERM_ID)||{};
  if(!t)throw new Error('term not found');
  const byid=Object.fromEntries(terms.map(x=>[x.id,x]));
  const name=p.display_name_ja||t.ja;
  document.title=name+'｜いちみず会EBP関連用語ライブラリー';

  let h='<p class="back"><a href="../">← 検索・索引へ戻る</a></p>';
  for(const tab of (t.library_tabs||[])){
    const label=tab==='behavioral_economics'?'行動経済学':tab==='psychology'?'心理学':tab;
    h+='<span class="pill">'+esc(label)+'</span>';
  }
  h+='<h2>'+esc(name)+'</h2>';

  h+='<section class="panel primary"><h2>ひとことで</h2><p>'+esc(p.plain_summary||t.original_definition||'')+'</p></section>';
  h+='<section class="panel example"><h2>防犯でいうと</h2><p>'+esc(p.plain_example||t.application_hypothesis||'')+'</p></section>';

  if(t.limitations){
    h+='<section class="panel caution"><h2>使うときの注意</h2><p>'+esc(t.limitations)+'</p></section>';
  }

  h+='<details class="panel"><summary>もう少し詳しく</summary>';
  if(t.explanation) h+='<div class="detail-row"><strong>考え方・作用</strong><p>'+esc(t.explanation)+'</p></div>';
  if(t.original_definition) h+='<div class="detail-row"><strong>研究上の定義</strong><p>'+esc(t.original_definition)+'</p></div>';
  h+='</details>';

  h+='<details class="panel"><summary>研究として見るとき</summary>';
  if(t.evidence_note) h+='<div class="detail-row"><strong>根拠について</strong><p>'+esc(t.evidence_note)+'</p></div>';
  if(t.source_scope) h+='<div class="detail-row"><strong>出典の範囲</strong><p>'+esc(t.source_scope)+'</p></div>';
  if(t.origin_audit_note) h+='<div class="detail-row"><strong>確認状況</strong><p>'+esc(t.origin_audit_note)+'</p></div>';
  if(t.en) h+='<div class="detail-row"><strong>英語名（検索・文献確認用）</strong><p>'+esc(t.en)+'</p></div>';
  h+='</details>';

  const sources=t.sources||[];
  h+='<section class="panel"><h2>原典・参考文献</h2>';
  if(!sources.length) h+='<p>登録された参考文献はありません。</p>';
  for(const s of sources){
    const title=esc(s.title||'資料');
    const url=String(s.url||'');
    h+='<div class="source">'+(url.startsWith('http')?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+title+'</a>':title);
    const notes=[s.role,s.verification_note].filter(Boolean).join('／');
    if(notes)h+='<br><small>'+esc(notes)+'</small>';
    h+='</div>';
  }
  h+='</section>';

  const rel=(t.related_terms||[]).filter(id=>byid[id]&&id!==TERM_ID);
  if(rel.length){
    h+='<section class="panel"><h2>関連用語</h2><div class="links">'+
      rel.map(id=>'<a href="'+encodeURIComponent(id)+'.html">'+esc(byid[id].ja)+'</a>').join('')+
      '</div></section>';
  }

  if(['threat-appraisal','coping-appraisal','self-efficacy'].includes(TERM_ID)){
    h+='<section class="panel"><h2>関連理論</h2><a href="../theories/protection-motivation-theory/">防護動機理論</a></section>';
  }
  if(t.articles&&t.articles.length){
    h+='<section class="panel"><h2>関連コラム</h2>'+
      t.articles.map(a=>'<div><a href="'+esc(a.url||'#')+'">'+esc(a.title||'関連資料')+'</a></div>').join('')+
      '</section>';
  }
  document.getElementById('main').innerHTML=h;
}).catch(err=>{
  document.getElementById('main').innerHTML='<p class="back"><a href="../">← 検索・索引へ戻る</a></p><div class="error">用語データを読み込めませんでした。glossary.json と plain_ja.json の配置を確認してください。</div>';
});
</script>
</body></html>
